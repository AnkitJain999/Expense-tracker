spring:
  application:
    name: expense-tracker
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expense_tracker}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: 8080

app:
  jwt:
    # Base64-encoded 256-bit secret. Override in production via APP_JWT_SECRET.
    secret: ${APP_JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1zZWNyZXQta2V5LTEyMzQ1Ng==}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  mail:
    from: ${APP_MAIL_FROM:no-reply@expense-tracker.local}
    enabled: ${APP_MAIL_ENABLED:true}

logging:
  level:
    org.flywaydb: info
